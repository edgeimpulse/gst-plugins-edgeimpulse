name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install GStreamer dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-libav \
          gstreamer1.0-tools \
          gstreamer1.0-x \
          gstreamer1.0-alsa \
          gstreamer1.0-gl \
          gstreamer1.0-gtk3 \
          gstreamer1.0-qt5 \
          gstreamer1.0-pulseaudio

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      run: cargo fmt -- --check

    # The default and `ffi` feature sets embed a model at build time via the
    # runner's build script (it requires EI_MODEL or EI_PROJECT_ID/EI_API_KEY),
    # so they cannot be built here without provisioning model credentials.
    # Studio deployments supply that model; CI instead validates every
    # runner-free capability, the `eim` backend (which needs no build-time
    # model), and the backend guard.
    - name: Build runner-free matrix
      run: |
        cargo build --verbose --no-default-features --features ocr,presentation
        cargo build --verbose --no-default-features --features ocr
        cargo build --verbose --no-default-features --features presentation
        cargo build --verbose --no-default-features --features ingestion
        cargo build --verbose --no-default-features

    - name: Build inference backend (eim)
      run: cargo build --verbose --no-default-features --features eim

    - name: Backend guard must reject inference without a backend
      run: |
        if cargo build --no-default-features --features inference 2>/dev/null; then
          echo "GUARD FAILED: inference built without a backend"; exit 1
        fi
        echo "GUARD OK"

    - name: Run lib tests (runner-free set)
      run: cargo test --verbose --no-default-features --features ocr,presentation --lib

    - name: Run lib tests (eim)
      run: cargo test --verbose --no-default-features --features eim --lib