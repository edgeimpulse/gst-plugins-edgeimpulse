[package]
name = "gst-plugins-edgeimpulse"
version = "0.1.0"
edition = "2021"
description = "GStreamer plugin to run AI/ML inference via Edge Impulse machine learning models"
authors = ["Fernando Jiménez Moreno <fernando@edgeimpulse.com>"]
license = "BSD-3-Clause-Clear"
rust-version = "1.75"  # Minimum Rust version that supports edition 2024 features

[lib]
name = "gstedgeimpulse"
crate-type = ["cdylib"]

[features]
# Full plugin (all seven elements). Keeps backward compatibility with Edge
# Impulse Studio deployments and existing CI: a plain `cargo build` is unchanged.
default = ["ffi", "ocr", "presentation", "ingestion"]

# Capability: inference (video + audio elements, plus shared `common`).
# Requires a runner backend — enable `ffi` or `eim`, never `inference` alone.
inference = ["dep:edge-impulse-runner"]
ffi = ["inference", "edge-impulse-runner/ffi"]
eim = ["inference", "edge-impulse-runner/eim"]

# Capability: ingestion (sink element). Uses only the runner's ingestion API,
# so it builds without an inference backend (pure-Rust runner, no C++ SDK).
ingestion = ["dep:edge-impulse-runner"]

# Capability: presentation (overlay element + its cairo/pango render stack).
presentation = ["dep:cairo-rs", "dep:pango", "dep:pangocairo"]

# Capability: ocr (self-contained ocrs/rten text recognition). No runner.
ocr = ["dep:ocrs", "dep:rten", "dep:rten-imageproc"]

# Deprecated alias for `ocr` (keeps existing `--features ocrs` invocations working).
ocrs = ["ocr"]

[dependencies]
cairo-rs = { version = "0.20.7", optional = true }
glib = "0.20.7"
gstreamer = "0.23.4"
gstreamer-audio = "0.23.4"
gstreamer-base = "0.23.4"
gstreamer-app = "0.23.4"
gstreamer-video = "0.23.4"
hound = "3"
image = "0.24"
once_cell = "1.20.3"
pango = { version = "0.20.9", optional = true }
pangocairo = { version = "0.20.7", optional = true }
regex = "1.10.3"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread"] }
edge-impulse-runner = { git = "https://github.com/edgeimpulse/edge-impulse-runner-rs.git", rev = "21449c2", default-features = false, optional = true }
tempfile = "3.10"
ocrs = { version = "0.12.2", optional = true }
rten = { version = "0.24.0", optional = true, default-features = false, features = ["rten_format"] }
rten-imageproc = { version = "0.24.0", optional = true }

# `video_inference` imports `edge_impulse_runner::ffi`, which is only available
# when the runner (now optional) is built with the ffi backend. Gating it keeps
# `cargo build --examples` working for runner-free feature sets.
[[example]]
name = "video_inference"
path = "examples/video_inference.rs"
required-features = ["ffi"]

[dev-dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
cocoa = "0.26.0"
objc = "0.2.7"

[build-dependencies]
gst-plugin-version-helper = "0.8.2"
